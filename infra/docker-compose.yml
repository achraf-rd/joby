# Local stack: docker compose -f infra/docker-compose.yml up --build
# Secrets come from infra/.env (copy infra/.env.example).
name: joby

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: joby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      POSTGRES_DB: joby
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U joby -d joby]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://joby:${POSTGRES_PASSWORD}@postgres:5432/joby
      WEB_ORIGIN: http://localhost:8080
      AGENTS_API_URL: http://agents-api:8000
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?set in infra/.env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in infra/.env}
    ports:
      - 3000:3000
    depends_on:
      postgres:
        condition: service_healthy

  # Internal only: no published ports. Only the api calls it (ARCHITECTURE §2).
  agents-api:
    build: ../services/agents
    command:
      [
        sh,
        -c,
        alembic upgrade head && uvicorn joby_agents.agents_api.app:app --host 0.0.0.0 --port 8000,
      ]
    environment: &agents-env
      DATABASE_URL: postgresql+asyncpg://joby:${POSTGRES_PASSWORD}@postgres:5432/joby
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      API_INTERNAL_URL: http://api:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  agents-worker:
    build: ../services/agents
    command: [joby-agents-worker]
    environment: *agents-env
    depends_on:
      agents-api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - 8080:80
    depends_on:
      - api

  langfuse:
    image: langfuse/langfuse:2
    environment:
      DATABASE_URL: postgresql://joby:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in infra/.env}
      SALT: ${LANGFUSE_SALT:?set in infra/.env}
      TELEMETRY_ENABLED: 'false'
    ports:
      - 3001:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
